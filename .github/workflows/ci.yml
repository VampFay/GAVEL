name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Explicit (postinstall also covers this): without a generated client,
      # typecheck fails on every Prisma import — the exact failure mode the
      # v3 audit hit in its own sandbox.
      - name: Generate Prisma client (sqlite — dev/test provider)
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Production provider track: the committed Postgres schema must be
      # in sync with the canonical sqlite schema, must generate a valid
      # client, and the init migration must exist for migrate deploy.
      - name: PG schema drift check
        run: bun run schema:check

      - name: Generate Prisma client (postgresql — production provider)
        run: bun run db:generate:pg
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Migration files present
        run: |
          test -f prisma/migrations/migration_lock.toml
          test -f prisma/migrations/0001_init/migration.sql
          test -f prisma/migrations/0002_rls_tenant_isolation/migration.sql
          test -f prisma/migrations/0003_syncjob_queue/migration.sql
          grep -q 'provider = "postgresql"' prisma/migrations/migration_lock.toml

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: file::memory:?cache=shared
          NODE_ENV: production

  # WP 1.1 — database parity + RLS gate. Boots a real embedded PostgreSQL 16
  # (same major as the postgres:16-alpine dev container), applies the
  # committed migrations from scratch, replays them into a shadow database
  # to prove migrations ≡ schema (transactional drift validation), and
  # asserts the RLS tenant-isolation contract (fail-closed, per-tenant
  # visibility, cross-tenant write rejection, app-layer GUC injection).
  db-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch ICU 60 runtime for embedded PG (if needed)
        run: bash scripts/pg-fetch-icu.sh

      - name: Database parity + RLS verification
        run: bun scripts/verify-db-parity.ts
