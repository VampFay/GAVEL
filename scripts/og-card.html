<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Geist', 'Noto Sans SC', sans-serif;
    background: #FAFBF8;
    color: #1A2B24;
    position: relative;
  }
  /* ledger grid — same motif as the app hero */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(30,106,76,0.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(30,106,76,0.07) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 900px 500px at 24% 38%, rgba(30,106,76,0.10), transparent 65%);
  }
  .card {
    position: relative; width: 1200px; height: 630px;
    padding: 84px 96px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .row { display: flex; align-items: center; gap: 28px; }
  .mark { flex-shrink: 0; }
  h1 {
    font-size: 128px; font-weight: 700; letter-spacing: -0.045em;
    line-height: 0.95; color: #14231C;
  }
  .tagline {
    margin-top: 34px;
    font-size: 34px; font-weight: 500; letter-spacing: -0.01em;
    color: #2E4A3B;
  }
  .sub {
    margin-top: 14px;
    font-size: 22px; font-weight: 400;
    color: #5C6E63; max-width: 880px; line-height: 1.45;
  }
  .sub b { color: #1E6A4C; font-weight: 600; }
  .footer {
    position: absolute; left: 96px; right: 96px; bottom: 64px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(30,106,76,0.25); padding-top: 22px;
  }
  .footer .left {
    font-size: 19px; color: #5C6E63; font-weight: 500;
  }
  .footer .left em { font-style: normal; color: #B08A3E; font-weight: 600; }
  .footer .right {
    font-size: 17px; color: #8A978E; letter-spacing: 0.14em;
    text-transform: uppercase; font-weight: 500;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="card">
    <div class="row">
      <svg class="mark" width="132" height="132" viewBox="0 0 32 32" fill="none">
        <rect x="8" y="4" width="16" height="7" rx="2" fill="#1E6A4C" opacity="0.18"/>
        <rect x="8" y="4" width="16" height="7" rx="2" stroke="#1E6A4C" stroke-width="1.6"/>
        <line x1="16" y1="11" x2="16" y2="21.5" stroke="#1E6A4C" stroke-width="2.4" stroke-linecap="round"/>
        <rect x="6" y="24.5" width="20" height="4" rx="1" fill="#1E6A4C" opacity="0.18"/>
        <rect x="6" y="24.5" width="20" height="4" rx="1" stroke="#1E6A4C" stroke-width="1.6"/>
        <line x1="11" y1="22" x2="8.5" y2="19.5" stroke="#B08A3E" stroke-width="1.9" stroke-linecap="round"/>
        <line x1="21" y1="22" x2="23.5" y2="19.5" stroke="#B08A3E" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
      <h1>GAVEL</h1>
    </div>
    <div class="tagline">Forensic delivery-to-billing reconciliation.</div>
    <div class="sub">Reads what was contracted (SOWs), what was built (<b>GitHub &amp; Jira</b>), and what was invoiced — then surfaces the gap as an <b>evidence-backed finding</b> a human can approve and bill.</div>
    <div class="footer">
      <div class="left">The product proposes. <em>A human asserts.</em></div>
      <div class="right">Dev / IT services</div>
    </div>
  </div>
</body>
</html>
